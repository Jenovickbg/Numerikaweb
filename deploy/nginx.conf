# Numerika360 SARL — Nginx (Ubuntu / Hostinger VPS)
# Emplacement cible : /etc/nginx/sites-available/numerika360sarl.com
#
# Site 100 % statique — aucun Node.js, PHP ou reverse-proxy applicatif requis.
# Racine des fichiers : /var/www/numerika360

server {
    listen 80;
    listen [::]:80;
    server_name numerika360sarl.com www.numerika360sarl.com 2.24.85.144 _;

    # Redirection HTTPS (activer après Certbot / certificat Cloudflare Origin)
    # return 301 https://$host$request_uri;

    root /var/www/numerika360;
    index index.html;

    charset utf-8;

    # Sécurité de base
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/xml;

    # URL propre : /accueil → accueil.html
    location = /accueil {
        try_files /accueil.html =404;
    }

    location = /accueil/ {
        return 301 /accueil;
    }

    # Fichiers statiques
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Interdire l'accès aux fichiers cachés / config
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /deploy {
        deny all;
    }

    location ^~ /deploy/ {
        deny all;
    }

    error_page 404 /index.html;
}

